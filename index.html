<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusForge</title>
  <!-- Link to our stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============================
       HEADER
  ============================= -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">⚒</span>
        <span class="logo-text">FocusForge</span>
      </div>
      <div class="streak-badge" id="streakBadge">
        🔥 <span id="streakCount">0</span> day streak
      </div>
    </div>
  </header>

  <!-- ============================
       MAIN CONTENT
  ============================= -->
  <main class="main">

    <!-- TOP ROW: Timer + Progress -->
    <div class="top-row">

      <!-- POMODORO TIMER CARD -->
      <section class="card timer-card">
        <h2 class="card-title">Pomodoro Timer</h2>

        <!-- Mode label: shows "Work Session" or "Break Time" -->
        <div class="mode-label" id="modeLabel">Work Session</div>

        <!-- The big clock display -->
        <div class="timer-display" id="timerDisplay">25:00</div>

        <!-- Timer control buttons -->
        <div class="timer-buttons">
          <button class="btn btn-primary" id="startPauseBtn">Start</button>
          <button class="btn btn-secondary" id="resetBtn">Reset</button>
        </div>

        <!-- Session length settings -->
        <div class="timer-settings">
          <div class="setting-group">
            <label for="workMinutes">Work (min)</label>
            <input type="number" id="workMinutes" value="25" min="1" max="60" />
          </div>
          <div class="setting-group">
            <label for="breakMinutes">Break (min)</label>
            <input type="number" id="breakMinutes" value="5" min="1" max="30" />
          </div>
        </div>
      </section>

      <!-- DAILY PROGRESS CARD -->
      <section class="card progress-card">
        <h2 class="card-title">Daily Progress</h2>

        <!-- Completed sessions count -->
        <div class="sessions-count">
          <span class="sessions-number" id="sessionsCompleted">0</span>
          <span class="sessions-label">sessions completed today</span>
        </div>

        <!-- Progress bar (goal = 8 sessions) -->
        <div class="progress-bar-wrapper">
          <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progressBarFill"></div>
          </div>
          <div class="progress-bar-labels">
            <span>0</span>
            <span>Goal: 8 sessions</span>
          </div>
        </div>

        <!-- Session dots: one dot per session (up to 8) -->
        <div class="session-dots" id="sessionDots">
          <!-- Dots are generated by JavaScript -->
        </div>

        <!-- Streak info -->
        <div class="streak-info">
          <div class="streak-detail">
            <span class="streak-icon">🔥</span>
            <div>
              <div class="streak-number" id="streakDisplay">0</div>
              <div class="streak-desc">day streak</div>
            </div>
          </div>
          <div class="streak-detail">
            <span class="streak-icon">📅</span>
            <div>
              <div class="streak-number" id="lastActiveDisplay">—</div>
              <div class="streak-desc">last active</div>
            </div>
          </div>
        </div>
      </section>

    </div>

    <!-- BOTTOM ROW: Task List -->
    <section class="card tasks-card">
      <div class="tasks-header">
        <h2 class="card-title">Task List</h2>
        <!-- Summary: e.g. "2 / 5 done" -->
        <div class="task-summary" id="taskSummary">0 / 0 done</div>
      </div>

      <!-- Input row to add a new task -->
      <div class="task-input-row">
        <input
          type="text"
          id="taskInput"
          placeholder="Add a new task..."
          maxlength="120"
        />
        <button class="btn btn-primary" id="addTaskBtn">Add</button>
      </div>

      <!-- The list of tasks (populated by JavaScript) -->
      <ul class="task-list" id="taskList">
        <!-- Tasks are injected here by script.js -->
      </ul>

      <!-- Shown when there are no tasks -->
      <div class="empty-state" id="emptyState">
        <span>No tasks yet — add one above!</span>
      </div>
    </section>

  </main>

  <!-- Link to our JavaScript file (at the end so the HTML loads first) -->
  <script src="script.js"></script>
</body>
</html>
